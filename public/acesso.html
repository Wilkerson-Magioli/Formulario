<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d36a38" />
    <meta
      name="description"
      content="Participe da obra do Ministério Pão Vivo."
    />
    <title>Ministério Pão Vivo</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="acesso.css" />
  </head>
  <body class="access-page">
    <header class="access-header">
      <img
        src="assets/logo-oficial.png"
        alt="Ministério Pão Vivo"
        width="406"
        height="135"
      />
    </header>
    <main class="access-main">
      <section
        class="access-composition"
        aria-label="Participe da obra do Ministério Pão Vivo"
      >
        <div class="community-photo">
          <img
            src="assets/favela.jpg"
            alt="Casas de uma comunidade, em fotografia do site do Ministério Pão Vivo"
            width="1484"
            height="570"
          />
          <div class="community-caption">
            <span class="community-line" aria-hidden="true"></span>
            <h1>Plantando igrejas.<br /><em>Transformando vidas.</em></h1>
          </div>
        </div>
        <div class="access-code-card">
          <span class="access-code-label">FAÇA PARTE DESTA OBRA</span>
          <a
            class="access-code-link"
            href="/"
            aria-label="Acessar o formulário de participação do Ministério Pão Vivo"
          >
            <img
              src="assets/qr-code-acesso-simples.png"
              alt="QR Code de acesso ao formulário de participação"
              width="720"
              height="720"
            />
          </a>
          <a class="access-donation-link" href="/">
            Toque aqui para participar e doar <span aria-hidden="true">↗</span>
          </a>
          <div class="participation-note">
            <span aria-hidden="true">✦</span>
            <p>
              Sua oração e sua generosidade<br />fazem parte desta história.
            </p>
          </div>
        </div>
      </section>
      <p class="access-document">
        <a href="assets/qr-code-acesso-clicavel.pdf#view=Fit" download>
          Baixar QR Code com link clicável em PDF
        </a>
      </p>
      <footer class="access-footer">
        <span aria-hidden="true"></span> Fé que alimenta. Amor que alcança.
      </footer>
    </main>
  </body>
</html>
